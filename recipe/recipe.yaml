schema_version: 1

context:
  name: google-cloud-batch
  version: "0.22.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_batch-${{ version }}.tar.gz
  sha256: 64b1c3b3e0dd14f1ff2ca973b1c916549f2617425cfc9a22e22533243a5ecc6b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # tightest of upstream's floors (python >=3.14)
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.batch
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Batch API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-batch
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-batch
  documentation: https://googleapis.dev/python/batch/latest/index.html

extra:
  recipe-maintainers:
    - xylar
